data:
  raw_path: data/raw/diamonds.csv
  processed_path: data/processed/diamonds_features.csv

clean:
  max_dimension_mm: 20

train:
  train_path: data/processed/diamonds_features.csv
  model: gradient_boosting              # linear | random_forest | gradient_boosting
  log_target: true          # true = entraîner sur log(price)
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  max_depth: 10
  learning_rate: 0.1